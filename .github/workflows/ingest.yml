name: ingest

on:
  schedule:
    # Three tries an hour, away from the busy top of the hour. GitHub does not guarantee scheduled runs:
    # with one run an hour it fired only twice in about ten hours on the first day. The job is safe to
    # repeat (articles are matched by id, unchanged sections are skipped), so more tries just make a
    # missed one less likely to matter.
    - cron: "11,31,51 * * * *"
  workflow_dispatch:

# Never run two ingestions at once: they share the embedding budget.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/jobs/requirements.txt

      - run: pip install -r backend/jobs/requirements.txt

      - name: Fetch feeds, store and embed
        working-directory: backend
        # 12 texts per try: three tries an hour keep the embedding use at about 36 an hour, as before.
        run: python jobs/ingest.py --embed-per-run 12

      - name: Build category summaries
        working-directory: backend
        run: python jobs/summarize.py
