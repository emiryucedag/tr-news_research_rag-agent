name: ingest

on:
  schedule:
    # Every hour at minute 7 (avoids the busiest minute at the top of the hour).
    - cron: "7 * * * *"
  workflow_dispatch:

# Never run two ingestions at once: they share the embedding budget.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/jobs/requirements.txt

      - run: pip install -r backend/jobs/requirements.txt

      - name: Run ingestion
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python jobs/ingest.py
